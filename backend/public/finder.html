<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Found a dog? | Aevea Pet ID</title>
<style>
  :root { --bg:#f6f4ef; --fg:#1d1d1b; --card:#fff; --accent:#1f6f5c; --warn:#b3261e; --muted:#6b6b66; --line:#e2dfd6; }
  @media (prefers-color-scheme: dark) { :root { --bg:#141413; --fg:#f1efe8; --card:#1f1f1d; --accent:#5cc4a8; --warn:#ff8a80; --muted:#a3a29b; --line:#33332f; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:17px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
  main { max-width:560px; margin:0 auto; padding:16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px; margin:12px 0; }
  h1 { font-size:1.6rem; margin:4px 0 2px; }
  h2 { font-size:1.1rem; margin:0 0 8px; }
  .muted { color:var(--muted); font-size:.9rem; }
  .banner { border-radius:12px; padding:12px 14px; font-weight:600; }
  .lost { background:var(--warn); color:#fff; }
  .warn { border:1px solid var(--warn); color:var(--warn); }
  img.photo { width:100%; max-height:300px; object-fit:cover; border-radius:12px; display:block; margin-bottom:12px; }
  dl { display:grid; grid-template-columns:auto 1fr; gap:6px 14px; margin:0; }
  dt { color:var(--muted); } dd { margin:0; }
  textarea, input { width:100%; font:inherit; padding:12px; border-radius:10px; border:1px solid var(--line); background:var(--bg); color:var(--fg); }
  textarea { min-height:120px; resize:vertical; }
  label { display:block; margin:10px 0 4px; font-weight:600; }
  button { width:100%; min-height:48px; margin-top:14px; font:inherit; font-weight:700; border:0; border-radius:12px; background:var(--accent); color:#fff; }
  @media (prefers-color-scheme: dark) { button { color:#0b1a16; } }
  button[disabled] { opacity:.6; }
  .hp { position:absolute; left:-9999px; height:0; overflow:hidden; }
  #status[role=status] { margin-top:10px; }
  .reply { border-left:3px solid var(--accent); padding-left:10px; margin:8px 0; }
</style>
</head>
<body>
<main>
  <p class="muted">Aevea Pet ID</p>
  <div id="app"><p>Loading...</p></div>
</main>
<script>
(function () {
  var app = document.getElementById('app');
  var slug = location.pathname.split('/').pop();
  var q = new URLSearchParams(location.search);
  var v = q.get('v');
  function el(tag, attrs, text) {
    var e = document.createElement(tag);
    if (attrs) for (var k in attrs) e.setAttribute(k, attrs[k]);
    if (text !== undefined) e.textContent = text;
    return e;
  }
  function add(parent) { for (var i = 1; i < arguments.length; i++) parent.appendChild(arguments[i]); return parent; }
  function fail(msg) { app.replaceChildren(add(el('div', { class: 'card' }), el('h1', 0, 'Page not found'), el('p', 0, msg))); }

  fetch('/api/public/pets/' + encodeURIComponent(slug) + (v && v !== 'unverified' ? '?v=' + encodeURIComponent(v) : ''))
    .then(function (r) { if (!r.ok) throw new Error(); return r.json(); })
    .then(render)
    .catch(function () { fail('This Pet ID link is not valid.'); });

  function render(p) {
    app.replaceChildren();
    if (p.reported_lost) app.appendChild(el('div', { class: 'banner lost', role: 'alert' }, 'This dog has been reported lost. Thank you for helping.'));
    if (v === 'unverified' || (v && !p.tap_verified)) app.appendChild(el('div', { class: 'banner warn', style: 'margin-top:12px' }, 'This tap could not be verified. The details below are still the owner’s public details.'));
    var c = el('div', { class: 'card' });
    if (p.photo_url) { var img = el('img', { class: 'photo', alt: 'Photo of ' + p.name, referrerpolicy: 'no-referrer' }); img.src = p.photo_url; c.appendChild(img); }
    c.appendChild(el('h1', 0, p.name));
    var dl = el('dl');
    [['Species', p.species], ['Breed', p.breed], ['Colour', p.colour], ['Size', p.size], ['Owner', p.owner_first_name]].forEach(function (r) {
      if (r[1]) add(dl, el('dt', 0, r[0]), el('dd', 0, r[1]));
    });
    c.appendChild(dl);
    app.appendChild(c);
    if (p.medical_alert) add(app, add(el('div', { class: 'card' }), el('h2', 0, 'Health note'), el('p', 0, p.medical_alert)));
    if (p.notes) add(app, add(el('div', { class: 'card' }), el('h2', 0, 'Notes from the owner'), el('p', 0, p.notes)));
    app.appendChild(form(p));
  }

  function form(p) {
    var card = el('div', { class: 'card' });
    add(card, el('h2', 0, 'Contact the owner'),
      el('p', { class: 'muted' }, 'Your message goes to the owner through Aevea Secure Relay. The owner’s phone number and email are never shown to you, and yours are never shared. Do not include personal details you do not want to share.'));
    var f = el('form', { novalidate: '' });
    var msg = el('textarea', { id: 'message', maxlength: '500', required: '', placeholder: 'Where is the dog? Where can the owner meet you?' });
    var chalQ = el('label', { for: 'answer' }, '...');
    var ans = el('input', { id: 'answer', inputmode: 'numeric', autocomplete: 'off', required: '' });
    var hp = el('div', { class: 'hp', 'aria-hidden': 'true' });
    var hpi = el('input', { name: 'website', tabindex: '-1', autocomplete: 'off' });
    hp.appendChild(hpi);
    var btn = el('button', { type: 'submit' }, 'Send message');
    var status = el('div', { id: 'status', role: 'status' });
    add(f, el('label', { for: 'message' }, 'Message'), msg, chalQ, ans, hp, btn, status);
    card.appendChild(f);
    var challengeId = null;
    function loadChallenge() {
      return fetch('/api/public/challenge').then(function (r) { return r.json(); }).then(function (c) { challengeId = c.challenge_id; chalQ.textContent = 'Quick check: ' + c.question; });
    }
    loadChallenge();
    f.addEventListener('submit', function (e) {
      e.preventDefault();
      if (!msg.value.trim() || msg.value.trim().length < 3) { status.textContent = 'Please write a short message.'; return; }
      btn.disabled = true; status.textContent = 'Sending...';
      fetch('/api/public/pets/' + encodeURIComponent(slug) + '/contact', {
        method: 'POST', headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ message: msg.value.trim(), challenge_id: challengeId, answer: ans.value.trim(), website: hpi.value, tap_token: v && v !== 'unverified' ? v : undefined })
      }).then(function (r) { return r.json().then(function (j) { return { ok: r.ok, status: r.status, j: j }; }); })
        .then(function (res) {
          if (res.ok) {
            f.replaceChildren(el('p', 0, 'Sent. The owner has been notified.'));
            if (res.j.reply_token) poll(card, res.j.reply_token);
          } else {
            btn.disabled = false;
            status.textContent = res.status === 429 ? 'Too many messages. Please try again later.' : res.j.error && res.j.error.code === 'challenge_failed' ? 'That answer was not right. Try the new question.' : 'Could not send. Please try again.';
            ans.value = ''; loadChallenge();
          }
        }).catch(function () { btn.disabled = false; status.textContent = 'Network error. Please try again.'; });
    });
    return card;
  }

  function poll(card, token) {
    var box = el('div'); card.appendChild(box);
    add(box, el('p', { class: 'muted' }, 'Keep this page open to see a reply from the owner.'));
    var seen = 0;
    var t = setInterval(function () {
      fetch('/api/public/relay/' + encodeURIComponent(token)).then(function (r) { return r.json(); }).then(function (j) {
        if (j.replies && j.replies.length > seen) { for (; seen < j.replies.length; seen++) box.appendChild(el('div', { class: 'reply' }, j.replies[seen].body)); }
      }).catch(function () {});
    }, 10000);
    setTimeout(function () { clearInterval(t); }, 3600000);
  }
})();
</script>
</body>
</html>
